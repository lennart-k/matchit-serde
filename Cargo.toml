[package]
name = "matchit-serde"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A deserializer for matchit route matches"
homepage = "https://github.com/lennart-k/matchit-serde"

[dependencies]
matchit = "0.9"
serde = { version = "1.0", features = ["serde_derive"] }
derive_more = { version = "2.1", features = ["display"] }
thiserror = "2.0"
percent-encoding = "2.3"
